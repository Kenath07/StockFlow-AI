name: mobile
description: "StockFlow-AI Field Sales & Operations Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Networking & HTTP
  dio: ^5.4.3+1

  # Security & Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.3.3

  # Hardware Device Features
  geolocator: ^12.0.0
  mobile_scanner: ^5.1.1
  connectivity_plus: ^6.0.3

  # UI, Fonts & Formatting
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
