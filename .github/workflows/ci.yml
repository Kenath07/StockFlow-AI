name: StockFlow-AI Continuous Integration (CI)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend .NET Web API & Multi-Agent Automated Tests
  # -------------------------------------------------------------
  backend-test:
    name: Backend & AI Agents (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        working-directory: ./backend
        run: dotnet restore StockFlow.slnx

      - name: Build Backend Solution
        working-directory: ./backend
        run: dotnet build StockFlow.slnx --no-restore --configuration Release

      - name: Run Backend & AI Golden Tests
        working-directory: ./backend
        run: dotnet test StockFlow.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=backend_tests.trx"

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./backend/tests/StockFlow.Tests/TestResults/backend_tests.trx

  # -------------------------------------------------------------
  # Job 2: Frontend Web React Application & Vitest Suite
  # -------------------------------------------------------------
  frontend-test:
    name: Frontend Web (React 19 + Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend-web
        run: npm install

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend-web
        run: npm test

      - name: Build Frontend Production Assets
        working-directory: ./frontend-web
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Mobile Flutter Application Tests
  # -------------------------------------------------------------
  mobile-test:
    name: Mobile Client (Flutter 3.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Flutter Widget & Unit Tests
        working-directory: ./mobile
        run: flutter test
